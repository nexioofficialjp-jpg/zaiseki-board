<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>在席ボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="me">
    <div id="card"></div>
    <button id="undo" class="undo">直前に戻す</button>
    <div id="flow" class="flow"></div>
    <div id="err" class="err"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    var TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9]/g, '');
    var me = null, busy = false, statuses = [];

    function next(s) { return statuses.length ? statuses[(statuses.indexOf(s) + 1) % statuses.length] : ''; }
    function setErr(e) { document.getElementById('err').textContent = e && e.message ? e.message : (e || ''); busy = false; }

    function render() {
      var box = document.getElementById('card'); box.innerHTML = '';
      if (!me) { box.textContent = '表示できません'; return; }
      var t = Z.tile(me, { hint: 'タップで「' + next(me.status) + '」に' });
      t.onclick = function () { setLocal(next(me.status)); };
      box.appendChild(t);
      document.getElementById('flow').textContent = statuses.join(' → ') + (statuses.length ? ' → ' + statuses[0] : '');
    }

    function load() {
      Z.apiGet({ api: 'me', t: TOKEN }).then(function (m) { if (busy) return; me = m; render(); setErr(''); })
        .catch(function (e) { me = null; render(); setErr(e); });
    }

    // タップした瞬間に画面を変える。連打できる。短い間の連打は最終状態だけを1回サーバーに送る。
    var pend = null;   // { before, target, timer, inflight }
    var lastBefore = null;   // 直近の連打前の状態(「直前に戻す」用)
    function setLocal(status) {
      if (!me) return;
      if (!pend) { pend = { before: { status: me.status, updated: me.updated }, target: null, timer: null, inflight: false }; lastBefore = pend.before.status; }
      busy = true;
      me.status = status; me.updated = Date.now(); render();
      pend.target = status;
      clearTimeout(pend.timer);
      pend.timer = setTimeout(flush, 350);
    }
    function flush() {
      if (!pend || pend.inflight || pend.target == null) return;
      var target = pend.target; pend.target = null; pend.inflight = true;
      Z.apiPost({ action: 'me_set', t: TOKEN, status: target }).then(function (m) {
        pend.inflight = false;
        if (pend.target != null) { flush(); return; }
        pend = null; busy = false; me = m; render(); setErr('');
      }).catch(function (e) {
        var b = pend.before; pend = null; busy = false;
        me.status = b.status; me.updated = b.updated; render();
        setErr('反映できませんでした: ' + e.message);
      });
    }
    document.getElementById('undo').onclick = function () {
      if (!me) return;
      if (lastBefore && lastBefore !== me.status) { setLocal(lastBefore); return; }
      if (busy) return; busy = true;
      Z.apiPost({ action: 'me_undo', t: TOKEN }).then(function (m) { me = m; render(); busy = false; setErr(''); }).catch(setErr);
    };

    Z.apiGet({ api: 'state' }).then(function (s) { statuses = s.statuses; render(); }).catch(function () {});
    load(); setInterval(load, 5000);
  </script>
</body>
</html>
