<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在席ボード</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="top">
    <span id="time" class="time">--:--</span>
    <span id="date" class="date"></span>
    <span class="spacer"></span>
    <span id="err" class="err"></span>
    <span class="cols" id="cols"></span>
  </div>
  <div id="root"></div>
  <div id="empty" class="empty" style="display:none">名簿が空です</div>
  <div class="foot">在席ボード</div>
  <div id="toast" class="toast"><span id="toastMsg"></span><button id="undoBtn">戻す</button></div>

  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script>
    var state = { statuses: [], locations: [], members: [] };
    var busy = {};      // id → true 通信中(その間はポーリング結果でその人を上書きしない)

    // 列数 (この端末に記憶)
    // 列数: 「自動」は画面幅に合わせて入るだけ並べる(コマ最小幅 170px)。数字は固定列。スマホ幅は常に2列(CSS)。
    var COL_CHOICES = ['自動', 6, 8, 10, 12];
    var cols = localStorage.getItem('zaiseki_cols2') || '自動';
    function applyCols() {
      var fixed = cols !== '自動';
      document.documentElement.style.setProperty('--cols', fixed ? cols : 1);
      document.body.classList.toggle('fixed-cols', fixed);
      var box = document.getElementById('cols'); box.innerHTML = '';
      COL_CHOICES.forEach(function (n) {
        var b = document.createElement('button'); b.textContent = n; b.className = String(n) === String(cols) ? 'on' : '';
        b.onclick = function () { cols = String(n); localStorage.setItem('zaiseki_cols2', cols); applyCols(); render(); };
        box.appendChild(b);
      });
    }

    function setErr(msg) {
      document.getElementById('err').textContent = msg || '';
    }

    function render() {
      var root = document.getElementById('root'); root.innerHTML = '';
      document.getElementById('empty').style.display = state.members.length ? 'none' : '';
      var groups = state.locations.slice();
      var others = state.members.filter(function (m) { return state.locations.indexOf(m.location) < 0; });
      if (others.length) groups.push('その他');
      groups.forEach(function (loc) {
        var list = loc === 'その他' ? others : state.members.filter(function (m) { return m.location === loc; });
        var present = list.filter(function (m) { return m.status === state.statuses[0]; }).length;
        var h = document.createElement('div'); h.className = 'loc';
        h.innerHTML = '<span class="nm"></span><span class="cnt"></span>';
        h.querySelector('.nm').textContent = loc;
        h.querySelector('.cnt').textContent = list.length ? (state.statuses[0] + ' ' + present + ' / ' + list.length) : '(登録なし)';
        var g = document.createElement('div'); g.className = 'grid' + (cols !== '自動' ? ' fixed' : '');
        list.forEach(function (m) {
          var t = Z.tile(m);
          t.onclick = function () { tap(m.id); };
          g.appendChild(t);
        });
        root.appendChild(h); root.appendChild(g);
      });
    }

    function member(id) {
      for (var i = 0; i < state.members.length; i++) if (state.members[i].id === id) return state.members[i];
      return null;
    }
    function apply(res) {
      var m = member(res.id);
      if (m) { m.status = res.status; m.updated = res.updated; }
      render();
    }
    function nextStatus(s) { return state.statuses[(state.statuses.indexOf(s) + 1) % state.statuses.length]; }

    // タップした瞬間に画面を変える。連打できる。短い間の連打は最終状態だけを1回サーバーに送る。
    // 失敗したら連打前の状態に戻す。
    var pending = {};   // id → { before, target, timer, inflight }
    var SEND_DELAY_MS = 350;

    function startPending(id, m) {
      if (!pending[id]) pending[id] = { before: { status: m.status, updated: m.updated }, target: null, timer: null, inflight: false };
      busy[id] = true;
      return pending[id];
    }
    function setLocal(id, status) {
      var m = member(id); if (!m) return null;
      var p = startPending(id, m);
      m.status = status; m.updated = Date.now(); render();
      p.target = status;
      clearTimeout(p.timer);
      p.timer = setTimeout(function () { flush(id); }, SEND_DELAY_MS);
      return p;
    }
    function flush(id) {
      var p = pending[id];
      if (!p || p.inflight || p.target == null) return;
      var target = p.target; p.target = null; p.inflight = true;
      Z.apiPost({ action: 'set', id: id, status: target }).then(function (res) {
        p.inflight = false;
        if (p.target != null) { flush(id); return; }   // 送信中にさらに押された
        busy[id] = false; delete pending[id]; apply(res); setErr('');
      }).catch(function (e) {
        p.inflight = false; busy[id] = false;
        var m = member(id); if (m) { m.status = p.before.status; m.updated = p.before.updated; }
        delete pending[id]; render();
        setErr('反映できませんでした: ' + e.message);
      });
    }
    function tap(id) {
      var m = member(id); if (!m) return;
      var p = setLocal(id, nextStatus(m.status));
      if (!p) return;
      Z.toast(m.name + ': ' + p.before.status + ' → ' + m.status, function () { setLocal(id, p.before.status); });
    }

    function poll() {
      Z.apiGet({ api: 'state' }).then(function (s) {
        // 通信中の人は手元の表示を優先する
        s.members.forEach(function (n) { if (busy[n.id]) { var m = member(n.id); if (m) { n.status = m.status; n.updated = m.updated; } } });
        state = s; render(); setErr('');
      }).catch(function (e) { setErr('通信エラー: ' + e.message); });
    }

    function clock() {
      var d = new Date();
      document.getElementById('time').textContent = Z.pad(d.getHours()) + ':' + Z.pad(d.getMinutes());
      document.getElementById('date').textContent = d.getFullYear() + '/' + Z.pad(d.getMonth() + 1) + '/' + Z.pad(d.getDate());
    }

    applyCols(); clock(); setInterval(clock, 10000);
    poll(); setInterval(poll, Z.cfg.pollMs);
  </script>
</body>
</html>
